<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 圣诞节快乐 - Christmas Animation</title>
    
    <!-- CSS样式 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #0a0a23, #1a1a3a, #2d1b69, #0c1445);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            overflow: hidden;
            height: 100vh;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #container {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .overlay > * {
            pointer-events: auto;
        }

        .title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .main-title {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ffd700, #ff69b4);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textGradient 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }

        @keyframes textGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .sub-title {
            font-size: 2rem;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255, 215, 0, 0.8); }
            to { text-shadow: 0 0 30px rgba(255, 215, 0, 1), 0 0 40px rgba(255, 215, 0, 0.8); }
        }

        .greeting {
            font-size: 1.2rem;
            color: #ffffff;
            opacity: 0.9;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            font-style: italic;
            letter-spacing: 1px;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 1rem;
            animation: fall linear infinite;
            z-index: 5;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .gift-box {
            position: absolute;
            bottom: 20%;
            left: 10%;
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            border: 3px solid #ffd700;
            border-radius: 10px;
            cursor: pointer;
            z-index: 15;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4), 
                        0 0 30px rgba(255, 215, 0, 0.3);
            animation: giftPulse 2s ease-in-out infinite;
        }

        @keyframes giftPulse {
            0%, 100% { 
                box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4), 
                           0 0 30px rgba(255, 215, 0, 0.3);
            }
            50% { 
                box-shadow: 0 8px 25px rgba(231, 76, 60, 0.6), 
                           0 0 40px rgba(255, 215, 0, 0.5);
                transform: translateY(-2px);
            }
        }

        .gift-box:hover {
            transform: scale(1.2) rotate(10deg) translateY(-5px);
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.8), 
                        0 0 50px rgba(255, 215, 0, 0.7);
        }

        .gift-box::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 35%;
            width: 30%;
            height: calc(100% + 10px);
            background: #ffd700;
            border-radius: 3px;
        }

        .gift-box::after {
            content: '';
            position: absolute;
            top: 35%;
            left: -5px;
            width: calc(100% + 10px);
            height: 30%;
            background: #ffd700;
            border-radius: 3px;
        }

        .firework {
            position: absolute;
            border-radius: 50%;
            z-index: 8;
        }

        .music-control {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 215, 0, 0.5);
            color: white;
            padding: 12px 18px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .music-control:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 215, 0, 0.8);
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .controls-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(15px);
            color: white;
            font-size: 12px;
            min-width: 200px;
            transition: all 0.3s ease;
        }

        .controls-panel:hover {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 215, 0, 0.8);
        }

        .controls-panel h4 {
            margin-bottom: 10px;
            color: #ffd700;
            text-align: center;
            font-size: 14px;
        }

        .control-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            padding: 2px 0;
        }

        .control-key {
            background: rgba(255, 215, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 10px;
        }

        .camera-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            color: #ffd700;
            font-size: 11px;
            font-family: monospace;
            backdrop-filter: blur(10px);
        }

        .reset-button {
            position: absolute;
            top: 80px;
            right: 20px;
            z-index: 20;
            background: rgba(255, 69, 0, 0.2);
            border: 2px solid rgba(255, 69, 0, 0.5);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
            font-size: 12px;
        }

        .reset-button:hover {
            background: rgba(255, 69, 0, 0.4);
            border-color: rgba(255, 69, 0, 0.8);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
            }
            .sub-title {
                font-size: 1.5rem;
            }
            .greeting {
                font-size: 1rem;
            }
        }
    </style>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Three.js OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Animate.css CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <!-- AOS (Animate On Scroll) CDN -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body>
    <div id="container">
        <!-- Three.js Canvas -->
        <canvas id="webgl-canvas"></canvas>
        
        <!-- 镜头控制面板 -->
        <div class="controls-panel">
            <h4>🎮 镜头控制</h4>
            <div class="control-item">
                <span>旋转视角:</span>
                <span class="control-key">鼠标拖拽</span>
            </div>
            <div class="control-item">
                <span>缩放:</span>
                <span class="control-key">滚轮</span>
            </div>
            <div class="control-item">
                <span>平移:</span>
                <span class="control-key">右键拖拽</span>
            </div>
            <div class="control-item">
                <span>自动旋转:</span>
                <span class="control-key">空格键</span>
            </div>
        </div>

        <!-- 音乐控制 -->
        <button class="music-control" onclick="toggleMusic()">🎵 背景音乐</button>
        
        <!-- 重置视角按钮 -->
        <button class="reset-button" onclick="resetCamera()">🔄 重置视角</button>
        
        <!-- 覆盖层内容 -->
        <div class="overlay">
            <!-- 标题区域 -->
            <div class="title" data-aos="fade-down" data-aos-duration="2000">
                <h1 class="main-title animate__animated animate__bounceInDown">🎄 圣诞快乐 🎄</h1>
                <h2 class="sub-title animate__animated animate__fadeInLeft animate__delay-1s">Merry Christmas</h2>
                <p class="greeting animate__animated animate__fadeInRight animate__delay-2s">愿你拥有一个温馨快乐的圣诞节！</p>
            </div>

            <!-- 礼物盒 -->
            <div class="gift-box animate__animated animate__bounceInUp animate__delay-3s" 
                 onclick="createFireworks()" 
                 data-aos="zoom-in" 
                 data-aos-delay="3000">
            </div>
        </div>

        <!-- 相机信息显示 -->
        <div class="camera-info" id="cameraInfo">
            <div>位置: X: 0, Y: 8, Z: 25</div>
            <div>距离: 26.92</div>
            <div>自动旋转: 关闭</div>
        </div>
    </div>

    <!-- 背景音乐 -->
    <audio id="bgMusic" loop>
        <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.wav" type="audio/wav">
    </audio>

    <script>
        // 全局变量
        let scene, camera, renderer, controls, christmasTree, snowParticles = [];
        let stars = [];
        let isPlaying = false;
        let autoRotate = false;
        let initialCameraPosition = { x: 0, y: 8, z: 25 };

        // 初始化
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x0c1445, 1, 1000);

            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(initialCameraPosition.x, initialCameraPosition.y, initialCameraPosition.z);

            // 创建渲染器
            const canvas = document.getElementById('webgl-canvas');
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // 创建光源
            createLights();

            // 创建圣诞树
            createChristmasTree();

            // 创建雪花粒子系统
            createSnowParticles();

            // 创建星星
            createStars();

            // 创建地面
            createGround();

            // 初始化镜头控制
            initControls();

            // 启动动画循环
            animate();

            // 初始化AOS
            AOS.init();

            // 创建雪花效果
            createSnowflakes();

            // 窗口调整大小事件
            window.addEventListener('resize', onWindowResize);
        }

        // 创建光源
        function createLights() {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0x404040, 0.3);
            scene.add(ambientLight);

            // 方向光
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // 点光源 - 圣诞树顶部的星星
            const pointLight = new THREE.PointLight(0xffd700, 1, 50);
            pointLight.position.set(0, 8, 0);
            scene.add(pointLight);

            // 彩色装饰灯
            for (let i = 0; i < 8; i++) {
                const color = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff][i % 6];
                const light = new THREE.PointLight(color, 0.5, 20);
                const angle = (i / 8) * Math.PI * 2;
                light.position.set(Math.cos(angle) * 6, 3, Math.sin(angle) * 6);
                scene.add(light);
            }
        }

        // 创建圣诞树
        function createChristmasTree() {
            christmasTree = new THREE.Group();

            // 树干
            const trunkGeometry = new THREE.CylinderGeometry(0.3, 0.5, 2, 8);
            const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 1;
            trunk.castShadow = true;
            christmasTree.add(trunk);

            // 树叶 - 三层
            for (let i = 0; i < 3; i++) {
                const radius = 3 - i * 0.7;
                const height = 3 - i * 0.3;
                const treeGeometry = new THREE.ConeGeometry(radius, height, 8);
                const treeMaterial = new THREE.MeshLambertMaterial({ color: 0x0F5132 });
                const treePart = new THREE.Mesh(treeGeometry, treeMaterial);
                treePart.position.y = 3 + i * 2;
                treePart.castShadow = true;
                christmasTree.add(treePart);
            }

            // 顶部星星
            const starGeometry = new THREE.SphereGeometry(0.3, 16, 16);
            const starMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xffd700, 
                emissive: 0xffd700, 
                emissiveIntensity: 0.3 
            });
            const star = new THREE.Mesh(starGeometry, starMaterial);
            star.position.y = 8;
            christmasTree.add(star);

            // 装饰球
            for (let i = 0; i < 20; i++) {
                const ballGeometry = new THREE.SphereGeometry(0.1, 8, 8);
                const colors = [0xff0000, 0x0000ff, 0xffd700, 0xff69b4];
                const ballMaterial = new THREE.MeshPhongMaterial({ 
                    color: colors[i % colors.length],
                    shininess: 100
                });
                const ball = new THREE.Mesh(ballGeometry, ballMaterial);
                
                const level = Math.floor(i / 7);
                const angle = (i / 7) * Math.PI * 2 + level;
                const radius = 2.5 - level * 0.6;
                ball.position.set(
                    Math.cos(angle) * radius * Math.random() * 0.8,
                    3 + level * 1.5 + Math.random() * 0.5,
                    Math.sin(angle) * radius * Math.random() * 0.8
                );
                christmasTree.add(ball);
            }

            scene.add(christmasTree);
        }

        // 创建雪花粒子系统
        function createSnowParticles() {
            const particleCount = 800;
            const positions = new Float32Array(particleCount * 3);
            const velocities = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 120;
                positions[i * 3 + 1] = Math.random() * 60;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 120;

                velocities[i * 3] = (Math.random() - 0.5) * 0.015;
                velocities[i * 3 + 1] = -Math.random() * 0.08 - 0.03;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.015;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.5,
                transparent: true,
                opacity: 0.6,
                sizeAttenuation: true
            });

            const particles = new THREE.Points(geometry, material);
            particles.userData = { velocities: velocities };
            scene.add(particles);
            snowParticles.push(particles);
        }

        // 创建星星
        function createStars() {
            const starCount = 200;
            const positions = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 200;
                positions[i * 3 + 1] = Math.random() * 100 + 20;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 200;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1,
                transparent: true,
                opacity: 0.6
            });

            const starsPoints = new THREE.Points(geometry, material);
            scene.add(starsPoints);
            stars.push(starsPoints);
        }

        // 创建地面
        function createGround() {
            const groundGeometry = new THREE.PlaneGeometry(50, 50);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = 0;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        // 初始化相机控制
        function initControls() {
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            
            // 控制设置
            controls.enableDamping = true; // 启用阻尼
            controls.dampingFactor = 0.05; // 阻尼系数
            controls.enableZoom = true; // 启用缩放
            controls.enablePan = true; // 启用平移
            controls.enableRotate = true; // 启用旋转
            
            // 限制范围
            controls.minDistance = 5; // 最小距离
            controls.maxDistance = 50; // 最大距离
            controls.minPolarAngle = 0; // 最小极角
            controls.maxPolarAngle = Math.PI; // 最大极角
            
            // 自动旋转设置
            controls.autoRotate = false;
            controls.autoRotateSpeed = 1.0;
            
            // 目标点设置
            controls.target.set(0, 4, 0);
            
            // 添加键盘事件监听
            document.addEventListener('keydown', onKeyDown);
            
            // 控制器变化事件
            controls.addEventListener('change', updateCameraInfo);
            
            controls.update();
        }

        // 键盘事件处理
        function onKeyDown(event) {
            switch(event.code) {
                case 'Space':
                    event.preventDefault();
                    toggleAutoRotate();
                    break;
                case 'KeyR':
                    resetCamera();
                    break;
                case 'KeyW':
                    camera.position.z -= 1;
                    controls.update();
                    break;
                case 'KeyS':
                    camera.position.z += 1;
                    controls.update();
                    break;
                case 'KeyA':
                    camera.position.x -= 1;
                    controls.update();
                    break;
                case 'KeyD':
                    camera.position.x += 1;
                    controls.update();
                    break;
            }
        }

        // 切换自动旋转
        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            updateCameraInfo();
        }

        // 重置相机位置
        function resetCamera() {
            camera.position.set(initialCameraPosition.x, initialCameraPosition.y, initialCameraPosition.z);
            controls.target.set(0, 4, 0);
            controls.autoRotate = false;
            autoRotate = false;
            controls.update();
            updateCameraInfo();
        }

        // 更新相机信息显示
        function updateCameraInfo() {
            const pos = camera.position;
            const distance = pos.distanceTo(controls.target);
            
            document.getElementById('cameraInfo').innerHTML = `
                <div>位置: X: ${pos.x.toFixed(1)}, Y: ${pos.y.toFixed(1)}, Z: ${pos.z.toFixed(1)}</div>
                <div>距离: ${distance.toFixed(2)}</div>
                <div>自动旋转: ${autoRotate ? '开启' : '关闭'}</div>
            `;
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            // 更新控制器
            if (controls) {
                controls.update();
            }

            // 圣诞树旋转
            if (christmasTree) {
                christmasTree.rotation.y += 0.005;
            }

            // 雪花下落动画
            snowParticles.forEach(particles => {
                const positions = particles.geometry.attributes.position.array;
                const velocities = particles.userData.velocities;

                for (let i = 0; i < positions.length; i += 3) {
                    positions[i] += velocities[i];
                    positions[i + 1] += velocities[i + 1];
                    positions[i + 2] += velocities[i + 2];

                    if (positions[i + 1] < 0) {
                        positions[i + 1] = 50;
                        positions[i] = (Math.random() - 0.5) * 100;
                        positions[i + 2] = (Math.random() - 0.5) * 100;
                    }
                }

                particles.geometry.attributes.position.needsUpdate = true;
            });

            // 星星闪烁
            stars.forEach(star => {
                star.material.opacity = 0.3 + Math.sin(Date.now() * 0.001) * 0.3;
            });

            renderer.render(scene, camera);
        }

        // 窗口调整大小
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (controls) {
                controls.handleResize();
            }
        }

        // 创建DOM雪花
        function createSnowflakes() {
            setInterval(() => {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = ['❄', '❅', '❆'][Math.floor(Math.random() * 3)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snowflake.style.opacity = Math.random();
                document.body.appendChild(snowflake);

                setTimeout(() => {
                    snowflake.remove();
                }, 8000);
            }, 500);
        }

        // 添加浮动装饰元素
        function createFloatingDecorations() {
            const decorations = ['🎄', '⭐', '🎁', '🔔', '🎀', '❄️'];
            
            setInterval(() => {
                if (Math.random() > 0.7) { // 降低生成频率
                    const decoration = document.createElement('div');
                    decoration.innerHTML = decorations[Math.floor(Math.random() * decorations.length)];
                    decoration.style.position = 'fixed';
                    decoration.style.left = Math.random() * window.innerWidth + 'px';
                    decoration.style.top = '-50px';
                    decoration.style.fontSize = (Math.random() * 20 + 15) + 'px';
                    decoration.style.opacity = '0.7';
                    decoration.style.zIndex = '3';
                    decoration.style.pointerEvents = 'none';
                    decoration.style.animation = `fall ${Math.random() * 4 + 6}s linear infinite`;
                    decoration.style.transform = `rotate(${Math.random() * 360}deg)`;
                    
                    document.body.appendChild(decoration);
                    
                    setTimeout(() => {
                        if (decoration.parentNode) {
                            decoration.remove();
                        }
                    }, 10000);
                }
            }, 2000);
        }

        // 创建烟花效果
        function createFireworks() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework animate__animated animate__zoomOut';
                    firework.style.left = Math.random() * window.innerWidth + 'px';
                    firework.style.top = Math.random() * window.innerHeight + 'px';
                    firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                    firework.style.width = firework.style.height = (Math.random() * 10 + 5) + 'px';
                    document.body.appendChild(firework);

                    setTimeout(() => {
                        firework.remove();
                    }, 1000);
                }, i * 100);
            }
        }

        // 音乐控制
        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const button = document.querySelector('.music-control');
            
            if (isPlaying) {
                music.pause();
                button.textContent = '🎵 播放音乐';
                isPlaying = false;
            } else {
                music.play().catch(e => {
                    console.log('音乐播放失败:', e);
                    button.textContent = '🔇 音乐不可用';
                });
                button.textContent = '🎵 暂停音乐';
                isPlaying = true;
            }
        }

        // 页面加载完成后初始化
        window.addEventListener('load', () => {
            init();
            
            // 启动浮动装饰
            createFloatingDecorations();
            
            // 初始化相机信息显示
            setTimeout(() => {
                updateCameraInfo();
            }, 1000);
            
            // 添加欢迎动画
            setTimeout(() => {
                document.querySelectorAll('.animate__animated').forEach(element => {
                    element.classList.add('animate__pulse');
                });
            }, 4000);
        });

        // 添加点击事件处理
        document.addEventListener('click', (event) => {
            if (event.target.classList.contains('gift-box')) {
                return; // 礼物盒已有自己的点击事件
            }
            
            // 在点击位置创建小烟花
            const x = event.clientX;
            const y = event.clientY;
            
            for (let i = 0; i < 5; i++) {
                const spark = document.createElement('div');
                spark.className = 'firework animate__animated animate__fadeOut';
                spark.style.position = 'fixed';
                spark.style.left = x + (Math.random() - 0.5) * 100 + 'px';
                spark.style.top = y + (Math.random() - 0.5) * 100 + 'px';
                spark.style.background = '#ffd700';
                spark.style.width = spark.style.height = '4px';
                spark.style.borderRadius = '50%';
                spark.style.pointerEvents = 'none';
                spark.style.zIndex = '100';
                document.body.appendChild(spark);

                setTimeout(() => {
                    spark.remove();
                }, 800);
            }
        });
    </script>
</body>
</html>
